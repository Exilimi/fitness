<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Тренировки и калории</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column, sticky top bar, fixed bottom tab bar like a native app */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E8ECF2; --ink:#131C28; --muted:#5D6979; --line:#D9DFE7;
  --accent:#2C55E0; --accent-ink:#FFFFFF; --accent-soft:#E2E9FC;
  --good:#1C9560; --warn:#C97F0E; --bad:#D9413A;
  --p:#2C55E0; --f:#C97F0E; --c:#1C9560;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --surface:#161F2A; --surface-2:#1E2936; --ink:#E7ECF2; --muted:#93A0B1; --line:#253140;
  --accent:#7392FF; --accent-ink:#0D131B; --accent-soft:#1C2A4C;
  --good:#3CC985; --warn:#EFA73C; --bad:#FF6A60; --p:#7392FF; --f:#EFA73C; --c:#3CC985; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#161F2A; --surface-2:#1E2936; --ink:#E7ECF2; --muted:#93A0B1; --line:#253140;
  --accent:#7392FF; --accent-ink:#0D131B; --accent-soft:#1C2A4C;
  --good:#3CC985; --warn:#EFA73C; --bad:#FF6A60; --p:#7392FF; --f:#EFA73C; --c:#3CC985; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.display{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 10px}
.top h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:8px 12px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5}
.icon-btn{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:72px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* ring */
.ring-wrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:36px;font-weight:700;line-height:1}
.macro{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .d{border-radius:12px;padding:8px 0;text-align:center;background:var(--surface);border:1px solid var(--line)}
.week .d .w{font-size:11px;color:var(--muted);font-weight:600}
.week .d .t{font-family:var(--display);font-size:20px;font-weight:700}
.week .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.week .d.done .t{color:var(--good)}

/* exercise */
.ex{border-top:1px solid var(--line);padding-block:14px}
.ex:first-child{border-top:0;padding-top:0}
.ex h3{font-size:16px}
.ex .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.plate{font-family:var(--display);font-weight:600;font-size:15px;padding:2px 9px;border-radius:7px;background:var(--surface-2)}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.set input{min-height:42px;padding:8px;text-align:center}
.check{width:48px;height:42px;border-radius:10px;border:2px solid var(--line);background:none;display:grid;place-items:center;font-size:20px;color:transparent}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tip{font-size:13px;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;margin-top:6px;list-style:none}
details.how summary{font-size:14px;padding-block:6px}
.how-body{display:flex;flex-direction:column;gap:8px;margin-top:6px}
canvas.anim{display:block;width:100%;max-width:360px;aspect-ratio:6/5;background:var(--surface-2);border-radius:12px;align-self:center}
.anim-cue{text-align:center;font-weight:700;font-size:15px;min-height:22px}
.vid{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
details summary::-webkit-details-marker{display:none}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* food */
.meal h3{font-size:15px}
.food{display:grid;grid-template-columns:1fr auto 32px;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.food:first-of-type{border-top:0}
.food .k{font-family:var(--display);font-size:18px;font-weight:600}
.food .x{border:0;background:none;color:var(--muted);font-size:18px;width:32px;height:32px}
.results{display:flex;flex-direction:column;max-height:260px;overflow:auto;border-radius:10px;background:var(--surface-2)}
.results button{border:0;background:none;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.results button:last-child{border-bottom:0}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgb(5 10 18 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px))}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:34px;height:42px;border-radius:8px 8px 12px 12px;border:2px solid var(--accent);background:none}
.water button.on{background:var(--accent)}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer .in{background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;width:100%;max-width:528px}
.timer .t{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.timer button{border:0;border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700}
.timer.end .in{background:var(--good);color:#fff}
.timer.end button{color:#fff}

.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px}
.sync{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:12px;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){.ring circle.fg{transition:stroke-dashoffset .5s ease}}
@media (max-width:360px){.ring-wrap{grid-template-columns:1fr;justify-items:center}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="title">Сегодня</h1><span class="sub" id="sub"></span></header>
  <main id="view" class="stack"></main>
</div>
<div id="timer" class="timer" hidden><div class="in"><div class="grow"><div class="label" style="color:inherit;opacity:.7">Отдых</div><div class="t" id="timerT">1:30</div></div><button id="timerPlus">+30 с</button><button id="timerStop">Готово</button></div></div>
<div class="tabs"><nav id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Сегодня</button>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Тренировки</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M3 3v8a2 2 0 0 0 2 2M17 21V3c2.5 1 4 3.5 4 7v3h-4"/></svg>Питание</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>Прогресс</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
</nav></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>

    {n:'Ягодичный мост со штангой',s:3,r:'10–12',rest:90,tip:'Лопатки на скамье, подбородок к груди. Поднимай таз ягодицами, пауза 1 секунда вверху.'},
    {n:'Жим гантелей на наклонной скамье',s:3,r:'10',rest:90,tip:'Наклон около 30°. Гантели опускай к верху груди.'},
    {n:'Тяга гантели одной рукой',s:3,r:'10 на руку',rest:60,tip:'Колено и рука на скамье, тяни локоть к бедру, не скручивай корпус.'},
    {n:'Сгибание ног в тренажёре',s:3,r:'12',rest:60,tip:'Вниз опускай медленно, 2–3 секунды.'},
    {n:'Разведение гантелей в стороны',s:3,r:'15',rest:45,tip:'Лёгкий вес, локти чуть согнуты, поднимай до уровня плеч.'},
    {n:'Прогулка фермера',s:3,r:'30–40 м',rest:60,tip:'Тяжёлые гантели в опущенных руках, плечи вниз, иди ровно. В «вес» пиши вес одной гантели.'}]}
};
// 0 = воскресенье
const SCHEDULE = {1:'A',3:'B',5:'C'};
const REST_DAYS = {
  0:{t:'Отдых',d:'Полный отдых или спокойная прогулка. Сон 7–8 часов помогает худеть не меньше тренировок.'},

};
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MEALS = [['b','Завтрак'],['l','Обед'],['d','Ужин'],['s','Перекусы']];

  ['Творог 5%',121,17.2,5,1.8],['Йогурт греческий 2%',73,10,2,3.6],['Кефир 1%',40,3,1,4],['Молоко 2,5%',52,2.8,2.5,4.7],

  ['Гречка варёная',110,4.2,1.1,21.3],['Рис белый варёный',116,2.2,0.5,24.9],['Рис бурый варёный',112,2.6,0.9,23],

/* Каждый документ несёт _ts (время изменения). Пишем в облако сразу; неотправленные ключи помним в fit:__dirty
   и досылаем при следующем запуске. Длинные значения режем на части: key = "#N", key__0..key__N-1. */
const pending={};
const CHUNK=4000;
function dirtySet(){return new Set(lsGet('__dirty')||[])}
function markDirty(key,on){const d=dirtySet();on?d.add(key):d.delete(key);lsSet('__dirty',[...d])}
function save(key,val,delay=0){
  val._ts=Date.now();
  lsSet(key,val); markDirty(key,true);
  if(!S.cloud) return;
  clearTimeout(pending[key]);
  if(delay) pending[key]=setTimeout(()=>push(key),delay); else push(key);
}
function push(key){
  delete pending[key];
  const val=lsGet(key); if(!val||!S.cloud) return;
  const ts=val._ts;
  cloudSet(key,JSON.stringify(val),ok=>{ const cur=lsGet(key); if(ok&&cur&&cur._ts===ts) markDirty(key,false); renderSync(); });
}
function flushAll(){for(const k of Object.keys(pending)){clearTimeout(pending[k]);push(k)}}
function cloudCall(fn,...args){return new Promise(res=>{try{S.cloud[fn](...args,(err,v)=>res(err?{err}:{v}))}catch(e){res({err:e})}})}
async function cloudSet(key,str,cb){
  if(str.length<=CHUNK){const r=await cloudCall('setItem',key,str);return cb(!r.err)}
  const parts=[];for(let i=0;i<str.length;i+=CHUNK) parts.push(str.slice(i,i+CHUNK));
  const rs=await Promise.all(parts.map((p,i)=>cloudCall('setItem',key+'__'+i,p)));
  if(rs.some(r=>r.err)) return cb(false);
  const r=await cloudCall('setItem',key,'#'+parts.length);cb(!r.err);
}
async function cloudGetMany(keys){
  const r=await cloudCall('getItems',keys);
  if(r.err||!r.v) return keys.map(()=>undefined);
  const raw=keys.map(k=>r.v[k]||'');
  const chunkKeys=[];
  raw.forEach((s,i)=>{if(s[0]==='#') for(let j=0;j<+s.slice(1);j++) chunkKeys.push(keys[i]+'__'+j)});
  let parts={};
  if(chunkKeys.length){const c=await cloudCall('getItems',chunkKeys);if(c.err||!c.v) return keys.map(()=>undefined);parts=c.v}
  return raw.map((s,i)=>{
    if(!s) return null;
    if(s[0]==='#'){let t='';for(let j=0;j<+s.slice(1);j++){const p=parts[keys[i]+'__'+j];if(p==null) return undefined;t+=p}s=t}
    try{return JSON.parse(s)}catch(e){return undefined}
  });
}

function mergeKey(k,cloudVal){

  if(cloudVal===null||(loc&&(loc._ts||0)>(cloudVal._ts||0))){if(loc) push(k);return loc}

}

function currentWeight(){
  const log=S.weights.log||{}; const keys=Object.keys(log).sort();
  return keys.length?log[keys[keys.length-1]]:S.profile.weight;
}
function targets(){
  const p=S.profile, w=currentWeight();
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.activity;
  const kcal=Math.max(Math.round((tdee-p.pace)/10)*10,Math.round(bmr/10)*10);
  const protein=Math.round(2*p.goal);
  const fat=Math.round(kcal*0.27/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {bmr,tdee,kcal,protein,fat,carbs};
}
function totals(k){
  const t={kcal:0,p:0,f:0,c:0}; for(const e of day(k).food){t.kcal+=e.kcal;t.p+=e.p;t.f+=e.f;t.c+=e.c} return t;
}

function programWeek(){

let animOn=false;
function animLoop(now){
  const list=document.querySelectorAll('details.how[open] canvas.anim');
  if(!list.length){animOn=false;return}
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  const col={ink:v('--ink'),far:v('--muted'),mut:v('--muted'),acc:v('--accent'),eq:v('--surface'),bg:v('--surface-2')};
  for(const cv of list){
    const key=cv.dataset.key,a=ANIM[key];if(!a) continue;
    const dpr=Math.min(3,window.devicePixelRatio||2);
    if(cv.width!==240*dpr){cv.width=240*dpr;cv.height=200*dpr}
    const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,240,200);

    a.front?drawFront(ctx,a,p,col):drawSide(ctx,a,p,col);

/* мои продукты: [название, ккал, Б, Ж, У, 1 = на штуку / 0 = на 100 г] */
function foodById(id){
  if(id[0]==='m'){const x=S.myfoods.list[+id.slice(1)];return {name:x[0],k:x[1],p:x[2],f:x[3],c:x[4],pc:!!x[5],mine:true}}
  const f=FOODS[+id.slice(1)];return {name:f[0],k:f[1],p:f[2],f:f[3],c:f[4],unit:f[5],pc:false};
}
function upsertMine(arr){
  const L=S.myfoods.list, i=L.findIndex(x=>x[0].toLowerCase()===arr[0].toLowerCase());
  if(i>=0) L.splice(i,1);
  L.unshift(arr); if(L.length>90) L.length=90;
  save('myfoods',S.myfoods);
}
function listFoods(q){
  q=q.trim().toLowerCase();
  const hit=n=>!q||n.toLowerCase().includes(q);
  const mine=S.myfoods.list.map((x,i)=>({id:'m'+i,n:x[0],k:x[1],pc:x[5]})).filter(x=>hit(x.n));
  const base=FOODS.map((f,i)=>({id:'b'+i,n:f[0],k:f[1]})).filter(x=>hit(x.n));
  const res=[...mine,...base].slice(0,60);
  $('#fres').innerHTML=res.length?res.map(x=>`<button data-act="fpick" data-id="${x.id}"><span>${x.id[0]==='m'?'<b style="color:var(--accent)">★</b> ':''}${esc(x.n)}</span><span class="muted num" style="font-size:15px;white-space:nowrap">${fmt(x.k)} ккал${x.pc?' / шт':''}</span></button>`).join(''):'<div class="note" style="padding:12px">Не нашёл. Добавь его через «Вручную», и он сохранится в «Мои продукты».</div>';
}
function pickFood(id){

  $('#fpick').innerHTML=`<div class="card stack" style="background:var(--surface-2);border:0"><div class="row between"><b>${f.mine?'★ ':''}${esc(f.name)}</b><button class="btn ghost small" data-act="funpick">Другое</button></div>
    <div class="muted" style="font-size:13px">${f.pc?'на 1 шт':'на 100 г'}: ${fmt(f.k)} ккал · Б ${f.p} · Ж ${f.f} · У ${f.c}</div>
    <div class="row">${f.pc?'':`<label class="field grow" for="fg"><span>Граммы</span><input id="fg" inputmode="decimal" value="${f.unit||100}"></label>`}
    ${f.pc||f.unit?`<label class="field grow" for="fu"><span>${f.pc?'Штук / порций':'или штук'}</span><input id="fu" inputmode="decimal" value="1"></label>`:''}</div>
    <div id="fcalc" class="num" style="font-size:22px;font-weight:700"></div><button class="btn" data-act="fadd">Добавить</button>
    ${f.mine?'<button class="btn ghost small" data-act="fdel-mine" style="color:var(--bad)">Удалить из «Моих продуктов»</button>':''}</div>`;
  const mult=()=>f.pc?num('#fu'):num('#fg')/100;
  const upd=()=>{const m=mult();$('#fcalc').textContent=fmt(f.k*m)+' ккал · Б '+r0(f.p*m)+' · Ж '+r0(f.f*m)+' · У '+r0(f.c*m)};
  if(!f.pc) $('#fg').addEventListener('input',upd);
  if(f.pc) $('#fu').addEventListener('input',upd);
  else if(f.unit) $('#fu').addEventListener('input',()=>{$('#fg').value=r0(num('#fu')*f.unit);upd()});

function addEntry(e){
  const k=S.tab==='food'?S.date:todayKey();
  day(k).food.push({id:Math.random().toString(36).slice(2,9),meal:foodCtx.meal,...e,kcal:r0(e.kcal),p:r1(e.p),f:r1(e.f),c:r1(e.c)});
  saveDay(k); closeSheet(); render(); toast('Добавлено: '+fmt(e.kcal)+' ккал');
}
async function aiEstimate(){
  const text=$('#fai').value.trim(); if(!text) return;
  const btn=$('#aigo'); btn.disabled=true; btn.textContent='Считаю…';
  try{
    const res=await S.sample.json(`Ты нутрициолог. Оцени калорийность и БЖУ еды по описанию. Если вес порции не указан, возьми типичную порцию для России. Разбей на отдельные продукты или блюда. Ответь только JSON без пояснений в формате {"items":[{"name":"название по-русски","g":граммы,"kcal":число,"p":белки_г,"f":жиры_г,"c":углеводы_г}]}.\n\nОписание: ${text}`,{modelTier:'quick'});
    const items=(res&&res.items||[]).filter(x=>x&&x.name).map(x=>({name:String(x.name),g:+x.g||0,kcal:+x.kcal||0,p:+x.p||0,f:+x.f||0,c:+x.c||0}));

      <div class="row between" style="margin-top:8px"><b class="num" style="font-size:22px">${fmt(sum)} ккал</b><button class="btn small" data-act="ai-add">Добавить всё</button></div></div>`;
  }catch(e){
    $('#aires').innerHTML=`<p class="note">${e&&e.code==='rate_limited'?'Слишком много запросов, попробуй через минуту.':e&&e.code==='not_granted'?'Нет разрешения на запросы к Claude. Используй список или ручной ввод.':'Не получилось посчитать. Переформулируй или добавь вручную.'}</p>`;
  }finally{btn.disabled=false;btn.textContent='Посчитать'}
}
function openWeight(){

/* ---------- rest timer ---------- */
let tEnd=0,tInt=null,audio=null;
function startTimer(sec){
  tEnd=Date.now()+sec*1000; $('#timer').hidden=false; $('#timer').classList.remove('end');
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume()}catch(e){}
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.ceil((tEnd-Date.now())/1000);
  if(left<=0){$('#timerT').textContent='Подход!';$('#timer').classList.add('end');clearInterval(tInt);beep();haptic('ok');setTimeout(()=>{if(Date.now()-tEnd>4000)$('#timer').hidden=true},5000);return}
  $('#timerT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}
function beep(){try{if(!audio)return;[0,.25,.5].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.15)})}catch(e){}}
$('#timerPlus').onclick=()=>{tEnd=Math.max(tEnd,Date.now())+30000;$('#timer').classList.remove('end');clearInterval(tInt);tInt=setInterval(tick,250);tick()};
$('#timerStop').onclick=()=>{clearInterval(tInt);$('#timer').hidden=true};

/* ---------- workout edits ---------- */
function wo(plan){
  const k=todayKey(), d=day(k);
  if(!d.workout||d.workout.plan!==plan) d.workout={plan,sets:{},done:false};
  return d.workout;
}
function setCell(plan,i,j){const w=wo(plan);w.sets[i]=w.sets[i]||[];w.sets[i][j]=w.sets[i][j]||{};return w.sets[i][j]}
function curPlan(){return S.open||planFor(todayKey())||'A'}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const vid=e.target.closest('a.vid');
  if(vid&&TG){e.preventDefault();try{TG.openLink(vid.href)}catch(err){window.open(vid.href,'_blank')}return}
  const el=e.target.closest('[data-act],[data-tab]'); if(!el) return;
  if(el.dataset.act&&MUTATING.has(el.dataset.act)&&!isReady()){toast('Загружаю данные из облака, секунду…');return}
  if(el.dataset.tab){go(el.dataset.tab);return}
  const a=el.dataset.act;
  if(a==='close-bg'){if(e.target===el)closeSheet();return}
  if(a==='close') return closeSheet();
  if(a==='go-train'){S.open=el.dataset.plan;go('train');return}
  if(a==='pick'){S.open=el.dataset.plan;render();return}
  if(a==='add-food') return openAddFood(el.dataset.meal);
  if(a==='fmode') return foodMode(el.dataset.m);
  if(a==='fpick') return pickFood(el.dataset.id);
  if(a==='funpick'){$('#fpick').innerHTML='';$('#fres').hidden=false;return}
  if(a==='fadd'){const f=foodById(foodCtx.pick),name=f.name.replace(/\s*\(.*\)$/,'');
    if(f.pc){const n=num('#fu');if(!n)return;return addEntry({name,n,g:0,kcal:f.k*n,p:f.p*n,f:f.f*n,c:f.c*n})}
    const g=num('#fg');if(!g)return;
    return addEntry({name,g,kcal:f.k*g/100,p:f.p*g/100,f:f.f*g/100,c:f.c*g/100})}
  if(a==='fdel-mine'){S.myfoods.list.splice(+foodCtx.pick.slice(1),1);save('myfoods',S.myfoods);$('#fpick').innerHTML='';$('#fres').hidden=false;listFoods($('#fq').value);toast('Удалено из «Моих продуктов»');return}
  if(a==='mper') return setManPer(el.dataset.v);
  if(a==='ai-go') return aiEstimate();
  if(a==='ai-add'){const k=S.tab==='food'?S.date:todayKey();const items=foodCtx.ai;const sum=items.reduce((s,x)=>s+x.kcal,0);
    items.forEach(x=>day(k).food.push({id:Math.random().toString(36).slice(2,9),meal:foodCtx.meal,...x,kcal:r0(x.kcal),p:r1(x.p),f:r1(x.f),c:r1(x.c)}));
    saveDay(k);closeSheet();render();toast('Добавлено: '+fmt(sum)+' ккал');return}
  if(a==='man-add'){
    const kc=num('#mk'),q=num('#mq'),pc=foodCtx.per==='pc',name=$('#mn').value.trim();
    if(!kc){toast('Укажи калории');return}
    if(!q){toast('Укажи, сколько съел');return}
    if($('#msave').checked){if(!name){toast('Дай продукту название, чтобы сохранить');return}
      upsertMine([name,kc,num('#mp'),num('#mf'),num('#mc'),pc?1:0])}
    const m=manMult();
    return addEntry({name:name||'Без названия',g:pc?0:q,n:pc?q:0,kcal:kc*m,p:num('#mp')*m,f:num('#mf')*m,c:num('#mc')*m})}
  if(a==='del-food'){const k=S.date;const d=day(k);d.food=d.food.filter(x=>x.id!==el.dataset.id);saveDay(k);render();return}
  if(a==='day'){const n=addDays(S.date,+el.dataset.n);if(n>todayKey())return;S.date=n;render();ensureDay(n);return}
  if(a==='water'){const k=todayKey(),d=day(k),n=+el.dataset.n;d.water=d.water===n?n-1:n;saveDay(k);render();return}
  if(a==='log-weight') return openWeight();
  if(a==='weight-save'){const v=parseFloat(($('#wv').value||'').replace(',','.'));if(!v||v<30||v>300){toast('Проверь вес');return}
    S.weights.log=S.weights.log||{};S.weights.log[todayKey()]=r1(v);save('weights',S.weights);closeSheet();render();toast('Вес записан');return}
  if(a==='set-d'){
    const plan=curPlan(),i=+el.dataset.i,j=+el.dataset.j,c=setCell(plan,i,j),ex=PROGRAM[plan].ex[i];
    c.d=!c.d;
    if(c.d){
      if(!c.w){const ph=document.getElementById(`w-${plan}-${i}-${j}`);if(ph&&ph.placeholder!=='кг')c.w=ph.placeholder}
      if(!c.r){const nums=ex.r.match(/\d+/g);c.r=nums?nums[nums.length-1]:''}
      if(c.w){S.lifts[plan+i]={w:c.w,r:c.r,date:todayKey()};save('lifts',S.lifts)}
      if(!S.profile.start){S.profile.start=todayKey();saveProfile()}
      haptic();startTimer(ex.rest);
    }
    saveDay(todayKey());render();return
  }
  if(a==='finish'){const w=wo(el.dataset.plan);w.done=true;saveDay(todayKey());clearInterval(tInt);$('#timer').hidden=true;render();toast('Тренировка записана');return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if((el.dataset.act==='set-w'||el.dataset.act==='set-r')&&!isReady()){render();return}
  if(el.dataset.act==='set-w'||el.dataset.act==='set-r'){
    const c=setCell(curPlan(),+el.dataset.i,+el.dataset.j);c[el.dataset.act==='set-w'?'w':'r']=el.value.trim();save(dayKeyId(todayKey()),day(todayKey()),400);

document.addEventListener('change',e=>{

    TG.onEvent('themeChanged',()=>{document.documentElement.setAttribute('data-theme',TG.colorScheme==='dark'?'dark':'light')});
  }catch(e){}
  if(TG.CloudStorage&&TG.isVersionAtLeast('6.9')){
    S.cloud=TG.CloudStorage;
    const keys=['profile','weights','lifts','myfoods'];
    for(let i=0;i<14;i++) keys.push(dayKeyId(addDays(todayKey(),-i)));
    for(const k of dirtySet()) if(!keys.includes(k)) keys.push(k);
    const vals=await Promise.race([cloudGetMany(keys),new Promise(r=>setTimeout(()=>r(keys.map(()=>undefined)),6000))]);
    keys.forEach((k,i)=>{
      const v=mergeKey(k,vals[i]);
      if(!v) return;
      if(k==='profile') S.profile={...DEFAULT_PROFILE,...v};
      else if(k==='weights') S.weights=v;
      else if(k==='lifts') S.lifts=v;
      else if(k==='myfoods') S.myfoods={list:v.list||[],_ts:v._ts};
      else if(k.startsWith('d-')){S.days[k.slice(2)]=v;fetchedDays.add(k.slice(2))}
    });
    if(!S.profile.weight0){S.profile.weight0=S.profile.weight;saveProfile()}
    else if(vals[0]===null&&!lsGet('profile')) save('profile',S.profile);
  }
  S.ready=true;
  if(S.tab!=='profile'||!document.activeElement||document.activeElement===document.body) render();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){flushAll();return}
  const t=todayKey(); if(S.date>t||S.lastToday!==t){S.lastToday=t;S.date=t;render()}
});
window.addEventListener('pagehide',flushAll);
S.lastToday=todayKey();
loadLocal(); render(); connect();
</script>
</body>
